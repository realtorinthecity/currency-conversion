    <style>
    :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --panel: #ffffff;
        --ink: #0b0b0b;
        --muted: #6f6f66;
        --line: #e6e6de;
        --accent: #dac520;
        --accent-ink: #0b0b0b;
        --focus: #0b0b0b;
        --warn: #8a4b00;
        --base-bg: #fbf6cc;
        --base-ink: #0b0b0b;
        --base-line: #dac520;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0b0b0b;
            --panel: #151515;
            --ink: #f5f5f0;
            --muted: #9a9a8e;
            --line: #2a2a26;
            --accent: #dac520;
            --accent-ink: #0b0b0b;
            --focus: #dac520;
            --warn: #e5b567;
            --base-bg: #dac520;
            --base-ink: #0b0b0b;
            --base-line: #dac520;
        }
    }

    * {
        box-sizing: border-box
    }

    html, body {
        height: 100%
    }

    html {
        background: var(--bg)
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .app {
        width: 100%;
        max-width: 420px;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg)
    }

    main {
        width: 100%;
        padding: 32px 18px 16px;
        flex: 1
    }

    @media (min-width: 600px) {
        body {
            padding: 24px 0;
            justify-content: center
        }

        .app {
            min-height: 720px;
            max-height: 900px;
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .12);
        }
    }

    .hero {
        margin: 0 0 1.5rem
    }

    h5 {
        font-size: 1rem;
        font-weight: 500;
        margin: 0 0 4px;
        color: var(--muted)
    }

    h1 {
        font-size: 1.6rem;
        font-weight: 800;
        margin: 0;
        letter-spacing: -.01em
    }


    .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px
    }

    label {
        display: block;
        font-size: .9rem;
        font-weight: 600;
        margin-bottom: 8px
    }

    .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap
    }

    input, select, button {
        font: inherit;
        color: inherit
    }

    #amount {
        flex: 2 1 180px;
        min-width: 0;
        padding: 14px;
        font-size: 1.4rem;
        font-weight: 600;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: transparent;
    }

    #base {
        flex: 1 1 110px;
        padding: 14px;
        font-size: 1.1rem;
        font-weight: 600;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
    }

    :is(#amount, #base, #reset):focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px
    }

    .results {
        margin-top: 20px;
        display: grid;
        gap: 10px
    }

    .res {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
    }

    .res.is-base {
        background: var(--base-bg);
        color: var(--base-ink);
        border-color: var(--base-line)
    }

    .res .code {
        font-weight: 800;
        font-size: 1.05rem
    }

    .res .tag {
        font-size: .8rem;
        opacity: .75;
        margin-left: 8px;
        font-weight: 400
    }

    .res .val {
        font-size: 1.6rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: right;
        overflow-wrap: anywhere
    }

    .actions {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap
    }

    #reset {
        padding: 11px 22px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        font-weight: 600;
        background: var(--accent);
        color: var(--accent-ink);
    }

    #reset:active {
        transform: translateY(1px)
    }

    .status {
        font-size: .82rem;
        color: var(--muted)
    }

    .status.warn {
        color: var(--warn)
    }

    footer {
        width: 100%;
        padding: 18px;
        text-align: center;
        font-size: .8rem;
        color: var(--muted);
        border-top: 1px solid var(--line);
        margin-top: 24px;
        padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    }
    </style>
</head>
<body>
    <div class="app">
        <main>
            <header class="hero">
                <h5>Hi there!</h5>
                <h1>Welcome to FX Convert</h1>
            </header>

            <div class="card">
                <label for="amount">Amount</label>
                <div class="row">
                    <input id="amount" type="text" inputmode="decimal" autocomplete="off" value="0" aria-describedby="status">
                    <select id="base" aria-label="Base currency">
                        <option value="USD">USD</option>
                        <option value="AED">AED</option>
                        <option value="INR">INR</option>
                        <option value="GEL">GEL</option>
                    </select>
                </div>

                <div class="results" id="results" aria-live="polite"></div>

                <div class="actions">
                    <button id="reset" type="button">Reset</button>
                    <span class="status" id="status">Loading rates…</span>
                </div>
            </div>
        </main>

        <footer>Designed and maintained by Charandeep Singh</footer>
    </div>

    <script>
    (function() {
        var CURRENCIES = ["USD", "AED", "INR", "GEL"];
        var API = "https://open.er-api.com/v6/latest/USD";
        var CACHE_KEY = "fx-rates-v2";
        // Built-in backup, used only if the API and the saved copy are both unavailable.
        var BACKUP = {
            USD: 1,
            AED: 3.6725,
            INR: 88,
            GEL: 2.7
        };

        var rates = BACKUP;
        var stamp = null;

        var amountEl = document.getElementById("amount");
        var baseEl = document.getElementById("base");
        var resultsEl = document.getElementById("results");
        var statusEl = document.getElementById("status");
        var resetEl = document.getElementById("reset");

        var fmt = new Intl.NumberFormat("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        function parseAmount(text) {
            var n = parseFloat(String(text).replace(/,/g, ""));
            return isFinite(n) && n > 0 ? n : 0;
        }

        function render() {
            var amount = parseAmount(amountEl.value);
            var base = baseEl.value;
            resultsEl.innerHTML = "";
            CURRENCIES.forEach(function(code) {
                var value = amount ? amount / rates[base] * rates[code] : 0;
                var row = document.createElement("div");
                row.className = "res" + (code === base ? " is-base" : "");
                var left = document.createElement("span");
                left.className = "code";
                left.textContent = code;
                if (code === base) {
                    var tag = document.createElement("span");
                    tag.className = "tag";
                    tag.textContent = "base";
                    left.appendChild(tag);
                }
                var right = document.createElement("span");
                right.className = "val";
                right.textContent = value ? fmt.format(value) : "0";
                row.appendChild(left);
                row.appendChild(right);
                resultsEl.appendChild(row);
            });
        }

        function setStatus(text, warn) {
            statusEl.textContent = text;
            statusEl.className = "status" + (warn ? " warn" : "");
        }

        function save(r, t) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({
                    rates: r,
                    time: t
                }));
            } catch (e) {}
        }
        function load() {
            try {
                return JSON.parse(localStorage.getItem(CACHE_KEY));
            } catch (e) {
                return null;
            }
        }

        function loadRates() {
            fetch(API)
            .then(function(res) {
                if (!res.ok)
                    throw new Error("HTTP " + res.status);
                return res.json();
            })
            .then(function(data) {
                if (data.result !== "success")
                    throw new Error("Bad response");
                var r = {};
                CURRENCIES.forEach(function(c) {
                    if (!data.rates || !data.rates[c])
                        throw new Error("Missing " + c);
                    r[c] = data.rates[c];
                });
                rates = r;
                stamp = data.time_last_update_utc || new Date().toUTCString();
                save(r, stamp);
                setStatus("Rates updated: " + stamp.replace(/ \+0000$/, " UTC"));
                render();
            })
            .catch(function() {
                var saved = load();
                if (saved && saved.rates) {
                    rates = saved.rates;
                    setStatus("Live rates unavailable. Using saved rates from " + saved.time + ", which may be outdated.", true);
                } else {
                    rates = BACKUP;
                    setStatus("Live rates unavailable. Using approximate built-in rates, which may be outdated.", true);
                }
                render();
            });
        }

        // Keep only digits, commas and one decimal point.
        amountEl.addEventListener("input", function() {
            var v = amountEl.value.replace(/[^0-9.,]/g, "");
            var i = v.indexOf(".");
            if (i !== -1)
                v = v.slice(0, i + 1) + v.slice(i + 1).replace(/\./g, "");
            amountEl.value = v;
            render();
        });
        amountEl.addEventListener("focus", function() {
            if (amountEl.value === "0")
                amountEl.select();
        });
        amountEl.addEventListener("blur", function() {
            if (amountEl.value.trim() === "")
                amountEl.value = "0";
        });
        baseEl.addEventListener("change", render);
        resetEl.addEventListener("click", function() {
            amountEl.value = "0";
            render();
            amountEl.focus();
        });

        render();
        loadRates();
    })();
    </script>
</body>
</html>
