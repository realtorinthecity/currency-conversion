<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property</title>
<!--OG-->
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;color:#4f4f4f;background:#fff;padding-bottom:110px}
.w{max-width:520px;margin:0 auto;padding:16px}h2{font-size:20px;margin:32px 0 12px;padding-bottom:8px;border-bottom:1px solid #999}
.gal{position:relative;height:230px;background:#d9d9d9;overflow:hidden}.gal img{width:100%;height:100%;object-fit:cover;display:none}.gal img.on{display:block}
.gal button{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer}
.pr{display:flex;align-items:center;gap:12px;margin-top:20px;font-size:20px;font-weight:600}.pr span.c{font-size:15px;font-weight:400;display:flex;gap:10px}
.c b{cursor:pointer;font-weight:400;padding:2px 6px;border-radius:6px}.c b.on{background:#e3e3e3;border:1px solid #bbb}
.r{display:flex;padding:5px 0;font-size:14.5px}.r>:first-child{width:42%;font-weight:600}.r>:last-child{flex:1}
.box{background:#eee;border:1px solid #ccc;border-radius:8px;padding:12px;margin:8px 0}.box .r>:first-child{width:30%}.box .r>*:nth-child(2){width:30%;flex:none}
.sub{font-weight:600;margin-top:14px;display:flex;justify-content:space-between}.tot{font-weight:700;border-top:1px solid #999;margin-top:14px;padding-top:8px;display:flex;justify-content:space-between}
p.t{font-size:14.5px;white-space:pre-line}
.bar{position:fixed;left:0;right:0;bottom:0;background:#f2f7ff;z-index:5}.bar .in{max-width:520px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 16px}
.av{width:72px;height:72px;border-radius:50%;background:#fff center/cover;flex:none}.bar .n{flex:1}.bar .n b{color:#000;display:block;font-size:17px}
.btn{background:#058fff;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:15px;cursor:pointer}
.ov{position:fixed;inset:0;background:#d9d9d9;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.ov.on{display:flex}
.x{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:24px;cursor:pointer}
.card{background:#fff;border-radius:12px;width:100%;max-width:480px;padding:36px 28px;max-height:90vh;overflow:auto}.card h3{text-align:center;font-weight:400;font-size:26px;margin:0 0 20px;padding-bottom:16px;border-bottom:1px solid #999}
.opt{display:block;width:100%;background:none;border:0;border-bottom:1px solid #999;color:#058fff;font-size:24px;padding:18px 0;cursor:pointer;text-align:center}.opt:last-child{border:0}
.fr{display:flex;align-items:center;margin:12px 0}.fr label{width:38%}.fr input,.fr select{flex:1;min-width:0;padding:12px;border:1px solid #bbb;border-radius:8px;background:#f9f9f9;font-size:15px}.tm{flex:1;display:flex;gap:6px}
.sb{width:100%;margin-top:24px;padding:16px;font-size:18px}.note{font-size:13px;color:#999;margin-top:12px}.note b{color:#f55;font-weight:400}.ty{text-align:center}.ty h3{font-weight:700;font-size:44px;border:0}
.gal .s{display:none;width:100%;height:100%}.gal .s.on{display:block}.gal .s img{display:block}.gal iframe,.gal video{width:100%;height:100%;border:0;background:#000}.gal button{z-index:2}.pr select{padding:6px 8px;border:1px solid #bbb;border-radius:8px;font-size:15px;background:#f4f4f4}.disc{font-size:12.5px;color:#888;margin-top:36px;border-top:1px solid #ddd;padding-top:12px}
.hl{padding-left:24px;font-size:14.5px}.hl li{margin:7px 0;padding-left:4px}.rich{font-size:14.5px}.rich ul,.rich ol{padding-left:22px}.rich h3{font-size:16px;margin:12px 0 4px}.rich a{color:#058fff}.rich p{margin:0 0 8px}
@media(max-width:600px){body{padding-bottom:84px}
.bar .in{gap:10px;padding:8px 12px;min-height:58px}
.bar .av{margin-top:-30px;border:3px solid #fff}
.bar .n{min-width:0}
.bar .n b,.bar .n span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .n b{font-size:14px}.bar .n span{font-size:12px}
.bar .btn{font-size:12px;padding:10px 12px}}
</style></head><body><div class="w" id="app"></div>
<div class="bar" id="bar" style="display:none"><div class="in"><div class="av" id="av"></div><div class="n"><b id="an"></b><span id="at"></span></div><button class="btn" onclick="op('m1')">Contact Now!</button></div></div>
<div class="ov" id="m1"><button class="x" onclick="cl()">✕</button><div class="card" style="padding:20px 28px">
<button class="opt" onclick="op('m2')">Book a Zoom Meeting</button><button class="opt" onclick="location.href='tel:'+D.tel">Call Directly</button>
<button class="opt" onclick="wa('Hey! I am interested in project '+D.proj+'. I would like to discuss it further to know more. Please call me back.')">WhatsApp Me</button>
<button class="opt" onclick="wa('Hi! I am interested in project '+D.proj+'. Request for a call back.')">Request for a Call Back</button></div></div>
<div class="ov" id="m2"><button class="x" onclick="cl()">✕</button><div class="card"><h3>Book a Zoom Meeting</h3>
<form id="zf"><div class="fr"><label>Your Name</label><input id="zn" required></div>
<div class="fr"><label>No. of Guests</label><input id="zg" type="number" min="1" required></div>
<div class="fr"><label>Time</label><input id="zt" type="text" placeholder="e.g. 3:30 PM" required></div>
<div class="fr"><label>Pick a Date</label><input id="zd" type="date" required></div>
<button class="btn sb">Submit a Request</button></form>
<div class="note"><b>All fields are mandatory.</b> By submitting this form, you're accepting the agent or agency to contact you.</div></div></div>
<div class="ov" id="m3"><button class="x" onclick="cl()">✕</button><div class="card ty"><h3>Thank You!</h3><p style="font-size:20px;padding:20px 0 40px">Your request has been submitted. You will be contacted soon. I appreciate your patience in this matter.</p></div></div>
<script>
window.CFG={slug:null,base:''};
const C=window.CFG,$=i=>document.getElementById(i);
const slug=C.slug||new URLSearchParams(location.search).get('p')||'default';
let D={},cur='AED',si=0;
const SY={AED:'AED ',USD:'$',GEL:'₾',INR:'₹'};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const M=u=>/^(https?:)?\/\//.test(u)?u:C.base+u;
async function fx(){try{const c=JSON.parse(localStorage.fx||'null');if(c&&Date.now()-c.t<432e5)return c.r}catch(e){}
 try{const j=await(await fetch('https://open.er-api.com/v6/latest/AED')).json();const r={USD:j.rates.USD,GEL:j.rates.GEL,INR:j.rates.INR};try{localStorage.fx=JSON.stringify({t:Date.now(),r})}catch(e){}return r}catch(e){return{USD:.2723,GEL:.74,INR:22.9}}}
Promise.all([fetch(C.base+'data/'+slug+'.json?v='+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}),fx()]).then(([d,r])=>init(d,r)).catch(()=>$('app').innerHTML='<p>Page not found.</p>');
const AL=['B','STRONG','I','EM','U','P','BR','UL','OL','LI','H3','A','DIV','SPAN'];
function clean(t){const doc=new DOMParser().parseFromString(t,'text/html');const w=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType==3)return;if(c.nodeType!=1){c.remove();return}
 if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED'].includes(c.tagName)){c.remove();return}w(c);if(!AL.includes(c.tagName)){c.replaceWith(...c.childNodes);return}
 [...c.attributes].forEach(a=>{if(!(c.tagName=='A'&&a.name=='href'&&/^(https?:|mailto:|tel:)/i.test(a.value)))c.removeAttribute(a.name)});if(c.tagName=='A'){c.target='_blank';c.rel='noopener'}})};w(doc.body);return doc.body.innerHTML}
const yt=u=>{const m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m&&m[1]};
function init(d,r){
 document.title=d.project;const P=+d.price||0,n=k=>+d[k]||0;
 const a=v=>'<span class="amt" data-aed="'+v.toFixed(2)+'"></span>';
 const st=k=>d['pp_'+k+'_on']!==false&&n('pp_'+k+'_pct')>0,tv=k=>st(k)?P*n('pp_'+k+'_pct')/100:0;
 const row=(l,k)=>{const mo=Math.floor(n('pp_'+k+'_months')),v=tv(k);return '<div class="r"><div>'+l+'</div><div>'+n('pp_'+k+'_pct')+'%'+(mo>0?' over '+mo+' months<br><small>('+a(v/mo)+' / month)</small>':'<br><small>One-time</small>')+'</div><div>'+a(v)+'</div></div>'};
 const grp=(t,ks,lb)=>{const any=ks.some(st);return '<div class="sub"><span>'+t+'</span><span>'+(any?a(ks.reduce((s,k)=>s+tv(k),0)):'Not required')+'</span></div>'+(any?'<div class="box">'+ks.filter(st).map(k=>row(lb[k],k)).join('')+'</div>':'')};
 const tot=['book','rem','ho','post'].reduce((s,k)=>s+tv(k),0);
 const lines=t=>(t||'').split('\n').map(l=>l.split('|')).filter(p=>p[0].trim());
 const list=(h,t)=>{const l=lines(t);return l.length?'<h2>'+h+'</h2>'+l.map(p=>'<div class="r"><div>'+E(p[0].trim())+'</div><div>'+(p.length>1?E(p[1].trim()):'✓')+'</div></div>').join(''):''};
 const imgs=(d.gallery||'').split('\n').map(s=>s.trim()).filter(Boolean);
 const sd=imgs.map(u=>'<div class="s"><img src="'+E(M(u))+'"></div>'),v=(d.video||'').trim();
 if(v){const id=yt(v);sd.push(id?'<div class="s"><iframe data-src="https://www.youtube-nocookie.com/embed/'+id+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>':'<div class="s"><video data-src="'+E(M(v))+'" controls playsinline></video></div>')}
 const ov=[['Project','project'],['Developer','developer'],['Type','type'],['Beds','beds'],['Size','size'],['Location','location'],['Unit View','view'],['Furnished?','furnished'],['Parking?','parking'],['Maintenance Fee','maintenance'],['Handover','handover']].filter(o=>d['show_'+o[1]]!==false&&String(d[o[1]]||'').trim());
 const sc=k=>d['sec_'+k]!==false,hl=(d.highlights||[]).filter(x=>String(x).trim());
 const txt=(h,t)=>{t=t||'';const rich=/<[a-z][\s\S]*>/i.test(t);if(!(rich?t.replace(/<[^>]*>/g,'').trim():t.trim()))return '';return '<h2>'+h+'</h2><div class="rich"'+(rich?'':' style="white-space:pre-line"')+'>'+(rich?clean(t):E(t))+'</div>'};
 $('app').innerHTML=(sc('gallery')&&sd.length?'<div class="gal">'+sd.join('')+(sd.length>1?'<button style="left:6px" onclick="go(si-1)">←</button><button style="right:6px" onclick="go(si+1)">→</button>':'')+'</div>':'')
 +'<div class="pr">Price <span id="price"></span><select id="cs"><option>AED</option><option>USD</option><option>GEL</option><option>INR</option></select></div>'
 +(sc('overview')&&ov.length?'<h2>Overview</h2>'+ov.map(o=>'<div class="r"><div>'+o[0]+'</div><div>'+E(d[o[1]])+'</div></div>').join(''):'')
 +(sc('highlights')&&hl.length?'<h2>Highlights</h2><ol class="hl">'+hl.map(x=>'<li>'+E(x)+'</li>').join('')+'</ol>':'')
 +(sc('payment')?'<h2>Payment Plan</h2>'+(sc('pay_con')?grp('During Construction',['book','rem'],{book:'Book Amount',rem:'Remaining'}):'')+(sc('pay_ho')?grp('On Handover',['ho'],{ho:'Payment'}):'')+(sc('pay_post')?grp('Post Handover',['post'],{post:'Pay'}):'')+(sc('pay_total')?'<div class="tot"><span>Total</span><span>'+a(tot)+'</span></div>':''):'')
 +(sc('amenities')?list('Amenities',d.amenities):'')+(sc('nearby')?list('Nearby Locations',d.nearby):'')
 +(sc('map')&&d.map?'<h2>Location Map</h2><img src="'+E(M(d.map))+'" style="width:100%;border-radius:8px">':'')
 +(sc('about_project')?txt('About Project',d.about_project):'')+(sc('about_dev')?txt('About Developer',d.about_dev):'')
 +'<p class="disc">Disclaimer: Price, size and offers shown are for reference only. Actual price, size and offers may vary at the time of booking. Currency conversions use indicative exchange rates.</p>';
 $('av').style.backgroundImage="url('"+E(d.agent_photo)+"')";$('an').textContent=d.agent_name;$('at').textContent=d.agent_title;$('bar').style.display='';
 D={proj:d.project,wa:String(d.whatsapp).replace(/\D/g,''),tel:d.phone,price:P,rates:{AED:1,...r}};
 $('cs').onchange=e=>{cur=e.target.value;draw()};draw();if($('app').querySelector('.gal'))go(0);
}
function fm(v,n){return SY[cur]+new Intl.NumberFormat('en-US',{minimumFractionDigits:n,maximumFractionDigits:n}).format(v*D.rates[cur])}
function draw(){document.querySelectorAll('.amt').forEach(s=>s.textContent=fm(+s.dataset.aed,2));$('price').textContent=fm(D.price,0)}
function go(i){const g=[...document.querySelectorAll('.gal .s')];si=(i+g.length)%g.length;g.forEach((e,j)=>{e.classList.toggle('on',j==si);const m=e.querySelector('iframe,video');if(m){if(j==si)m.src=m.dataset.src;else{if(m.pause)m.pause();m.removeAttribute('src');if(m.load)m.load()}}})}
function op(id){cl();$(id).classList.add('on')}function cl(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'))}
function wa(t){window.open('https://wa.me/'+D.wa+'?text='+encodeURIComponent(t),'_blank')}
$('zf').onsubmit=e=>{e.preventDefault();const v=i=>$(i).value;
 wa('Zoom meeting request for '+D.proj+'\nName: '+v('zn')+'\nGuests: '+v('zg')+'\nTime: '+v('zt')+'\nDate: '+v('zd'));e.target.reset();op('m3')};
</script></body></html>
